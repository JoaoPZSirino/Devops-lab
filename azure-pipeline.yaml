# ==============================================================================
# Pipeline CI/CD Básica - Azure DevOps (Free Tier)
# ==============================================================================
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Configura a versão do Python no agente do Azure DevOps
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: '1. Configurar Python 3.11'

  # 2. Instala os pacotes necessários
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: '2. Instalar Dependências'

  # 3. Executa os testes unitários (CI - Integração Contínua)
  - script: |
      pytest test_app.py -v
    displayName: '3. Executar Testes Unitários com Pytest'

  # 4. Constrói e publica a imagem no Docker Hub
  - task: Docker@2
    displayName: '5. Construir e Publicar no Docker Hub'
    inputs:
      # Container Repository
      #containerRegistry: # string. Container registry. 
      containerRegistry: 'dockerhub-connection'
      #repository: # string. Optional. Use when command != login && command != logout && command != start && command != stop. Container repository.       
      repository: 'joaopzsirino/devops-lab'
      # Commands
      command: 'buildAndPush'
      Dockerfile: '**/Dockerfile'
      tags: |
        $(Build.BuildId)
        latest