apiVersion: v1 
kind: Pod 
metadata: 
  labels: 
    run: projeto-devops 
    service: site
  name: projeto-devops
spec: 
  containers:
    - name: devops-lab 
      image: joaopzsirino/devops-lab:latest
      ports:
        - containerPort: 5000
  env:
    - name: CAT_API_KEY
      value: "$(CAT_API_KEY)"
  dnsPolicy: ClusterFirst 
  restartPolicy: Always